<script>
// Shim locale dell'API window.storage basato su localStorage: STESSE CHIAVI di sempre
// (grocery-lists-v3, grocery-settings-v3, grocery-gamification-v1), cosi' le liste e le
// opzioni gia' salvate non vengono cancellate aprendo questa versione.
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v, shared: false };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    const existed = localStorage.getItem(key) !== null;
    localStorage.removeItem(key);
    return { key, deleted: existed, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};
</script>

<script src="bundle.js"></script>
